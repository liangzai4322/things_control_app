name: Deploy TaskBox API

on:
  workflow_dispatch:
    inputs:
      enable_daily_intake_timers:
        description: Enable Daily Intake timers after all deployment gates pass
        required: false
        default: false
        type: boolean
      conversation_provisioning_public_key:
        description: Optional one-time base64-encoded RSA public key for encrypted Mac runner credential bootstrap
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: taskbox-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Upload release
        env:
          SSHPASS: ${{ secrets.TASKBOX_SERVER_PASSWORD }}
          HOST: ${{ secrets.TASKBOX_SERVER_HOST }}
          USER: ${{ secrets.TASKBOX_SERVER_USER }}
        run: |
          bundle="$(mktemp -d)"
          mkdir -p "$bundle/taskbox-api" "$bundle/daily-intake/integrations" "$bundle/daily-intake/scripts" "$bundle/assistant-gateway"
          cp -a server/taskbox-api/package.json server/taskbox-api/package-lock.json server/taskbox-api/schema.sql server/taskbox-api/src server/taskbox-api/scripts "$bundle/taskbox-api/"
          cp -a server/taskbox-api/systemd "$bundle/daily-intake/"
          for system in attention-system execution-system feedback-system health-system mission-system; do
            cp -a "integrations/$system" "$bundle/daily-intake/integrations/"
          done
          cp -a integrations/attention-system/systemd/. "$bundle/daily-intake/systemd/"
          cp -a integrations/assistant-gateway/. "$bundle/assistant-gateway/"
          cp scripts/consume-daily-intake-attention.mjs scripts/consume-daily-intake-execution.mjs scripts/consume-daily-intake-health.mjs scripts/consume-daily-intake-mission.mjs scripts/sync-hq-daily-intake-receipts.mjs "$bundle/daily-intake/scripts/"
          cp -a js "$bundle/daily-intake/"
          printf '{"private":true,"type":"module"}\n' > "$bundle/daily-intake/package.json"
          tar -C "$bundle" -czf /tmp/taskbox-api-release.tgz .
          rm -rf "$bundle"
          sshpass -e scp -o StrictHostKeyChecking=accept-new /tmp/taskbox-api-release.tgz "$USER@$HOST:/tmp/taskbox-api-release.tgz"

      - name: Deploy with backup and health check
        env:
          SSHPASS: ${{ secrets.TASKBOX_SERVER_PASSWORD }}
          HOST: ${{ secrets.TASKBOX_SERVER_HOST }}
          USER: ${{ secrets.TASKBOX_SERVER_USER }}
          ENABLE_DAILY_INTAKE_TIMERS: ${{ inputs.enable_daily_intake_timers && '1' || '0' }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$USER@$HOST" "
            set -e
            release=/tmp/taskbox-api-release
            rm -rf \"\$release\"
            mkdir -p \"\$release\"
            tar -xzf /tmp/taskbox-api-release.tgz -C \"\$release\"
            DAILY_INTAKE_ENABLE_TIMERS=$ENABLE_DAILY_INTAKE_TIMERS bash \"\$release/taskbox-api/scripts/deploy-system-candidates-release.sh\" \"\$release\"
            rm -rf \"\$release\" /tmp/taskbox-api-release.tgz
          "

      - name: Export encrypted Mac runner credentials
        if: ${{ inputs.conversation_provisioning_public_key != '' }}
        env:
          SSHPASS: ${{ secrets.TASKBOX_SERVER_PASSWORD }}
          HOST: ${{ secrets.TASKBOX_SERVER_HOST }}
          USER: ${{ secrets.TASKBOX_SERVER_USER }}
          PROVISIONING_PUBLIC_KEY: ${{ inputs.conversation_provisioning_public_key }}
        run: |
          printf '%s' "$PROVISIONING_PUBLIC_KEY" | base64 --decode > /tmp/assistant-provisioning.pub
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$USER@$HOST" \
            "PUB_B64='$PROVISIONING_PUBLIC_KEY' bash -s" <<'REMOTE'
          set -euo pipefail
          work="/tmp/assistant-conversation-provisioning"
          rm -rf "$work"
          mkdir -p "$work"
          printf '%s' "$PUB_B64" | base64 --decode > "$work/public.pem"
          openssl pkeyutl -encrypt -pubin -inkey "$work/public.pem" -pkeyopt rsa_padding_mode:oaep \
            -in /etc/taskbox-assistant-conversation-runner-token -out "$work/runner-token.enc"
          openssl pkeyutl -encrypt -pubin -inkey "$work/public.pem" -pkeyopt rsa_padding_mode:oaep \
            -in /etc/taskbox-assistant-conversation-payload-key -out "$work/payload-key.enc"
          rm -f "$work/public.pem"
          tar -C "$work" -czf /tmp/assistant-conversation-provisioning.tgz runner-token.enc payload-key.enc
          rm -rf "$work"
          REMOTE
          sshpass -e scp -o StrictHostKeyChecking=accept-new \
            "$USER@$HOST:/tmp/assistant-conversation-provisioning.tgz" /tmp/assistant-conversation-provisioning.tgz
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$USER@$HOST" \
            'rm -f /tmp/assistant-conversation-provisioning.tgz'

      - name: Upload encrypted Mac runner credentials
        if: ${{ inputs.conversation_provisioning_public_key != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: assistant-conversation-provisioning-${{ github.run_id }}
          path: /tmp/assistant-conversation-provisioning.tgz
          if-no-files-found: error
          retention-days: 1
